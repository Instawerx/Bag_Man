; Config file for config variables tied to gameplay

; The player-facing Lambda API. CONFIG, NOT ENVIRONMENT: every server-side URL is read from an env var,
; which works only because our tooling launches the dedicated server. A shipping client is launched by the
; player and has no environment we control, so a client resolving its endpoint that way would silently have
; none -- and "matchmaking does nothing" with no error is exactly the failure mode this avoids.
;
; Same API Gateway as the server endpoints; only the AUTH differs. Player calls (/create-ticket,
; /match-status) authenticate with the player's own PlayFab SessionTicket and carry NO shared secret --
; a key shipped to every player is a key every player has.
;
; AFL_API_BASE_URL still overrides this when set, so existing server tooling behaves identically.
;
; ⚠ THE QUOTES ARE LOAD-BEARING. UNQUOTED, UE'S INI PARSER TRUNCATES THIS VALUE AT THE `//` IN `https://`
; and hands back the string `https:` -- six characters, no host. The client then builds
; `https:/queues`, libcurl reads the path as a hostname, and the only symptom is
; `Could not resolve host: queues` three layers away from the config line that caused it.
;
; Measured 2026-08-10: `base URL resolved to 'https:' (len 6)`. Every client call goes through
; UAFLOnlineSubsystem::PlayerApiBaseUrl, so unquoted this breaks /create-ticket and /match-status too --
; it went unnoticed because prior testing exported AFL_API_BASE_URL, which wins over config and skips the
; parse entirely. The env var being the tested path and config being the SHIPPING path is precisely how a
; player-only failure hides. Do not remove the quotes.
[AFL.Online]
PlayerApiBaseUrl="https://1xm466mdc5.execute-api.us-east-1.amazonaws.com"

