; --- COOK COVERAGE FOR STRING-REFERENCED ASSETS -------------------------------------------------------
; The cooker only packages what something REFERENCES. An FSoftObjectPath built from a literal in C++ is
; not a reference the cooker can see, so the asset is silently dropped from the build -- and the failure
; only appears in a cooked run, never in PIE, where every asset is on disk anyway.
;
; MEASURED, 2026-08-09 acceptance run. The match-end results board never appeared on a cooked client:
;   LoadPackage: SkipPackage: /AFLBagMan/UI/WBP_AFL_MatchScoreboard - does not exist on disk or in the loader
;   Failed to find object '/AFLBagMan/UI/WBP_AFL_MatchScoreboard.WBP_AFL_MatchScoreboard_C'
; The server had concluded the match correctly and UAFLMatchEndPresenter had fired; the widget class it
; loads is named only by the literal in AFLMatchEndPresenter.cpp, so it was never cooked. That one missing
; asset also suppressed the CONTINUE button and therefore the entire return-to-frontend path, which is why
; a finished match sat in PostGame indefinitely.
;
; The sibling widgets in this same folder survive because the HUD layout asset hard-references them. Only
; the scoreboard is reached by string. Cooking the folder covers the whole family rather than this one file,
; so a future string-referenced widget dropped in beside it does not reintroduce the same silent failure.
+DirectoriesToAlwaysCook=(Path="/AFLBagMan/UI")

; SAME DEFECT, SECOND SITE -- found by the run that verified the fix above, in the only remaining load
; failure in the client log:
;   LoadPackage: SkipPackage: /Game/BagMan/ProMod/ABP_ProMod_FBIK_PP - does not exist on disk or in the loader
;
; UAFLFullBodyIKComponent names its post-process AnimBP the same way, by literal
; (AFLFullBodyIKComponent.cpp:15), and a content-wide search finds NO asset referencing it. So the whole
; folder was uncooked: the AnimBP, CR_ProMod_FBIK, and IK_ProMod_FBIK -- all three, 628 KB total.
;
; ⚠ FBIK HAS THEREFORE NEVER SHIPPED IN A PACKAGED BUILD. It is project doctrine on every character, it
; works in PIE where the assets are on disk, and it has been silently absent from every cooked client. The
; component's default is the path above; only a Pro variant that OVERRIDES it in the details panel would
; have produced a cookable reference, and nothing does.
+DirectoriesToAlwaysCook=(Path="/Game/BagMan/ProMod")

; THIRD PASS -- the whole class, found by tooling instead of by log-reading.
; Tools/AFL_Lint/cook_soft_refs.py scans shipping AFL source for asset paths built from C++
; literals and checks each against this list (R1) and against a real cook tree (R2). Run against
; the 2026-08-09 13:19 cook it found 53 such paths, and FIVE MORE shipping assets that were absent
; from the build for exactly the reason above -- none of which had ever produced a symptom anyone
; had traced:
;
;   /AFLBagMan/Loot/DA_AFL_LootConfig                    AFLLootDirectorComponent.cpp:25
;   /Game/BagMan/UI/Loadout/WBP_AFL_Loadout              AFLW_LoadoutBase.cpp:764
;   /Game/BagMan/UI/Loadout/WBP_AFL_LoadoutTile          AFLW_FrontEndMarket.cpp:205,653
;   /Game/BagMan/UI/Loadout/WBP_AFL_LoadoutSectionHeader AFLW_FrontEndMarket.cpp:655
;   /Game/BagMan/UI/Store/DT_AFL_PriceStyles             AFLW_LoadoutTileBase.cpp:26
;
; The /AFLBagMan/Loot case is the FBIK case again: the cooked tree had no Loot folder at all, so
; BP_AFL_LootCacheCarry went with the config it was declared beside.
;
; THE REST OF THIS LIST IS NOT CURRENTLY BROKEN, AND THAT IS THE POINT. Those paths do cook today,
; but only because some other asset happens to hard-reference them. That is the same accident that
; held the results board up until the day a folder changed, and it is not a guarantee. Cooking the
; folder makes it one. MEASURED COST of every entry below, from a full cook before and after
; (7,657/7,657 packages, 0 errors): 9,750 MB -> 9,798 MB and 7,182 -> 7,231 assets. So +48 MB and
; +49 assets, 0.49% of the build. Note the source-side estimate was 4.22 MB and was an order of
; magnitude low: it counted only the .uasset files inside each folder, not the .uexp bulk data or
; the dependencies those assets drag in. Folder granularity (not per-file) is kept from 07ff32d8
; so a sibling dropped in beside one of these is covered on arrival.
;
; Entries are recursive, so /Game/BagMan/Characters/Cosmetics covers Finishes/ and SkinColors/ too.
+DirectoriesToAlwaysCook=(Path="/AFLBagMan/Loot")
+DirectoriesToAlwaysCook=(Path="/AFLCombat/Tuning")
+DirectoriesToAlwaysCook=(Path="/AFLMovement/Input")
+DirectoriesToAlwaysCook=(Path="/Engine/BasicShapes")
+DirectoriesToAlwaysCook=(Path="/Game/BagMan/Characters/Cosmetics")
+DirectoriesToAlwaysCook=(Path="/Game/BagMan/Characters/Dismember")
+DirectoriesToAlwaysCook=(Path="/Game/BagMan/Phases")
+DirectoriesToAlwaysCook=(Path="/Game/BagMan/UI/Loadout")
+DirectoriesToAlwaysCook=(Path="/Game/BagMan/UI/Store")
+DirectoriesToAlwaysCook=(Path="/Game/Characters/Heroes/Mannequin/Meshes")
+DirectoriesToAlwaysCook=(Path="/Game/Effects/Audio_Sound_Effects")
+DirectoriesToAlwaysCook=(Path="/Game/Input/Mappings")
+DirectoriesToAlwaysCook=(Path="/Game/Weapons/Rifle/Animations")

; ── THE OTHER DIRECTION: content that must NEVER reach a shipping client ───────────────────────────────
;
; HOST IS DEPRECATED (operator ruling, 2026-08-10). Match allocation is now driven exclusively through the
; matchmaking queue -- door -> queue -> PlayFab/GameLift orchestration -- so a client-side "pick a map and
; listen-serve it" screen is not merely dead UI, it is a way to originate a session the allocator never
; authorised. It stays in the repo as a development tool and leaves the cooked build entirely.
;
; ⚠ THIS LINE IS THE WEAKER HALF OF THE FIX, AND THE MOVE IS THE STRONGER ONE. A hard reference from any
; cooked package outranks a directory filter: the cooker follows dependencies, so one surviving referencer
; pulls the whole screen back into the build no matter what is listed here. That is why the move took the
; two dead front-end roots -- W_IRONICS_FrontEnd and W_LyraFrontEnd -- with it rather than only the screen
; the ruling named. They were its only referencers besides the editor-only label, both are superseded by
; W_IRONICS_Home, and W_IRONICS_FrontEnd had no referencers of its own at all. Verified from the asset
; registry after the move: nothing outside /Game/DeveloperUtils points at any of the three, and no
; ObjectRedirectors were left behind in the cooked tree pointing into this folder.
;
; ⚠ AND NOTE WHAT DOES *NOT* DRIVE THE COOK HERE, because it is the obvious wrong answer: /Game/DefaultGame_Label
; sits at the content root with bLabelAssetsInMyDirectory=true, so the asset registry lists it as a referencer
; of essentially every package under /Game -- but the PrimaryAssetLabel type is scanned with bIsEditorOnly=True
; (line 92) and its Rules.CookRule is Unknown. An editor-only primary asset contributes no runtime cook
; dependency, and with bCookAll=False the cook set is MapsToCook + DirectoriesToAlwaysCook + the AlwaysCook
; primary assets + whatever those reach. So these three were only ever cooked by being REACHED, and cutting
; the last path to them is what actually removes them. This entry is defence in depth: it stops a future
; asset dropped in this folder from being reached back into the build by accident.
;
; The dev-side summon (afl.Debug.SummonHostMenu, AFLDevMenuCommands.cpp) is deliberately double-gated: the
; command does not compile under UE_BUILD_SHIPPING, and it resolves the screen by RUNTIME STRING PATH, which
; -- per the whole cook-refs investigation above -- creates no cook dependency. Here that long-standing trap
; is the correct mechanism rather than a bug: the one place we WANT a reference the cooker cannot see.
+DirectoriesToNeverCook=(Path="/Game/DeveloperUtils")

